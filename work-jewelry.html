<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飾品拍攝 · Yuna</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
/* layout: black-and-white editorial grid; type does the work; the purple star is the only colour and appears once per section */
:root{
  color-scheme:light;
  --bg:#fafafa; --ink:#0e0e10; --gray:#8b8b90; --faint:#d6d6da; --rule:#0e0e10; --tile:#f0f0f1; --purple:#ff4646;
  --grot:"Schibsted Grotesk","Noto Sans TC",system-ui,sans-serif; --tc:"Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--tc);font-size:15px;line-height:1.6;padding-inline:clamp(16px,5vw,72px);padding-block:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:1320px;margin:0 auto}
.lab{font-family:var(--grot);font-size:16px;color:var(--purple)}
.star{display:inline-block;width:.62em;height:.62em;vertical-align:.02em}
.hero h1 .star{margin-left:.14em}
.star svg{width:100%;height:100%;display:block;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* loader */
.loader{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s .1s,visibility .5s .1s}
.loader .fl{width:clamp(120px,15vw,180px);height:clamp(120px,15vw,180px);display:block;animation:spin 2.4s linear infinite}
.loader .n{font-family:var(--grot);font-weight:500;font-size:clamp(36px,4vw,52px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center}
.loader .n sup{color:var(--purple);font-size:.6em;letter-spacing:0;vertical-align:baseline}
.loader.done{opacity:0;visibility:hidden}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;padding-block:20px;position:sticky;top:0;z-index:30;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
.nav img{height:32px;display:block}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:clamp(20px,3vw,48px);font-family:var(--grot);font-size:16px;font-weight:500;letter-spacing:.04em}
.nav a:hover{color:var(--purple)}

/* hero */
.hero{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:24px;margin-inline:calc(50% - 50vw);padding-left:15vw;padding-right:16vw;min-height:calc(100svh - 70px);padding-block:clamp(12px,2vh,28px) clamp(70px,13vh,140px);position:relative}
.hero>div{align-self:end;width:max-content;max-width:100%}
.hero .tags{display:flex;justify-content:space-between;margin-bottom:14px}
.hero h1{font-family:var(--grot);font-weight:500;font-size:clamp(60px,11.5vw,210px);line-height:.9;letter-spacing:-.06em;margin:0}
.hero .sub{margin:20px 0 0;font-size:clamp(20px,2vw,24px);font-weight:300;line-height:1.5;min-height:1.5em}
.hero .sub .caret{display:inline-block;width:2px;height:1em;background:var(--purple);vertical-align:-.12em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero figure{margin:0;width:clamp(170px,16.5vw,340px);align-self:start;justify-self:end}
.hero figure img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.arrow{position:absolute;right:calc(16vw - 26px);bottom:clamp(36px,7vh,80px);width:2.5px;height:clamp(140px,22vh,260px);background:var(--purple)}
.arrow{animation:bob 1.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes bob{0%,100%{transform:translateY(-10px)}50%{transform:translateY(12px)}}
.arrow:after{content:"";position:absolute;left:50%;bottom:0;width:14px;height:14px;border-right:2.5px solid var(--purple);border-bottom:2.5px solid var(--purple);transform:translate(-50%,0) rotate(45deg);transform-origin:center}

/* about */
.about{height:210vh;position:relative}
.chap{position:relative;margin-top:-45vh;padding-top:1px}
#work{z-index:3;height:calc(100vh + 20vh + 2 * 80vh + 25vh)}
#bring{z-index:2;height:calc(100vh + 70vh + 45vh)}
.bpin{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:104px;padding-bottom:72px;will-change:opacity,transform}
.bpin>.proj-head{margin-top:0;margin-bottom:64px}.bpin:before{content:"";flex:1}.bpin:after{content:"";flex:2}
.chap:before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 50vw);right:calc(50% - 50vw);background:var(--bg);border-radius:32px 32px 0 0;z-index:-1}
.wpin{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:104px;padding-bottom:28px;will-change:opacity,transform}
.about .pin{will-change:opacity,transform}
.about .pin{position:sticky;top:0;height:100vh;height:100svh;display:flex;align-items:center}
.about .reveal{margin:0}
.meta-row{display:grid;grid-template-columns:1fr auto 1fr;border-bottom:1.5px solid var(--purple);padding-bottom:10px;font-family:var(--grot);font-size:16px}
.meta-row span:nth-child(2){text-align:center}.meta-row span:last-child{text-align:right}
.reveal{font-family:var(--tc);font-weight:500;font-size:clamp(24px,3.4vw,42px);line-height:1.45;letter-spacing:-.01em;margin:22px 0 0;max-width:22em}
.reveal span{color:var(--faint);transition:color .25s}
.reveal span.on{color:var(--ink)}
.reveal span.k.on{color:var(--purple)}

/* projects */
.proj-head{display:flex;justify-content:space-between;align-items:flex-end;margin-top:200px}
.proj-head h2 .star{width:.42em;height:.42em;margin-left:.16em;vertical-align:.04em}
.proj-head h2{font-family:var(--grot);font-weight:600;font-size:clamp(40px,11vw,80px);letter-spacing:-.05em;line-height:.9;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,4vw,48px) 12px;margin-top:clamp(28px,4vw,44px)}
.wpin>.proj-head{margin-top:0;margin-bottom:40px}.wpin:before{content:"";flex:1}.wpin:after{content:"";flex:2}
.rise{opacity:0;transform:translateY(140px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.rise.in{opacity:1;transform:none}
.rise.d1{transition-delay:.12s}
@media (prefers-reduced-motion:reduce){.rise{opacity:1;transform:none;transition:none}}
.stack{flex:none;margin-top:0;position:relative;clip-path:inset(-40px)}
.scards{position:absolute;inset:0}
.scard{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(20px,3vw,40px);padding:12px 12px 12px clamp(24px,3vw,44px);background:#fff;border:1px solid #e2e2e5;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.06);cursor:none;will-change:transform}
.scard+.scard{transform:translateY(calc(100% + 60px))}
.scard .ph{order:2;height:100%;aspect-ratio:auto;min-width:0;border-radius:12px;background:#e8e8eb}
.scard .empty{position:absolute;inset:0}
.scard .txt{display:flex;flex-direction:column;justify-content:center;padding-block:16px}
.scard h3{margin:0;font-family:var(--grot);font-weight:500;font-size:32px;letter-spacing:-.02em;line-height:1.1}
.scard .tg{margin:8px 0 0;padding-bottom:18px;border-bottom:1px solid #dcdce0;color:var(--purple);font-size:16px;font-weight:500}
.scard .ds{margin:18px 0 0;color:var(--ink);font-size:16px;line-height:1.75}
.scard:hover .ph img{transform:scale(1.05)}
.rows{margin-top:clamp(12px,2vw,24px)}
.row{--rp:clamp(18px,2.4vw,32px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center;padding:var(--rp);margin:clamp(16px,2.6vw,40px) calc(var(--rp) * -1);border:1.5px solid transparent;border-radius:12px;transition:border-color .3s}
.row:hover{border-color:var(--purple)}
.view{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--grot);font-size:14px;font-weight:600;letter-spacing:.06em;box-shadow:0 6px 20px rgba(0,0,0,.15);transform:scale(.4);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1.2),opacity .25s;pointer-events:none;z-index:2}
.row:hover .view{transform:scale(1);opacity:1}
.row.flip .ph{order:2}
.row .ph{border-radius:0}
.row .empty{position:absolute;inset:0}
.rm{display:flex;justify-content:space-between;font-family:var(--grot);font-size:14px;color:var(--ink);padding-bottom:10px;border-bottom:1px solid var(--faint)}
.rm span:first-child{color:var(--purple)}
.row h3{margin:0;font-family:var(--grot);font-weight:500;font-size:32px;letter-spacing:-.02em;line-height:1.1}
.row .tg{margin:6px 0 0;color:var(--purple);font-size:16px;font-weight:500}
.row .ds{margin:16px 0 0;color:var(--ink);font-size:16px;line-height:1.75}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.pl span{border:1px solid var(--purple);color:var(--purple);border-radius:999px;padding:2px 12px;font-family:var(--grot);font-size:14px}
.row:hover .ph img{filter:blur(6px);transform:scale(1.03)}
.card{display:block;cursor:none}
.ph{position:relative;overflow:hidden;background:var(--tile);aspect-ratio:576/354}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s,transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{filter:blur(6px) grayscale(.6);transform:scale(1.03)}
.chip{position:absolute;right:10px;bottom:10px;background:rgba(14,14,16,.55);color:#fff;font-family:var(--grot);font-size:14px;letter-spacing:.06em;border-radius:999px;padding:3px 10px;backdrop-filter:blur(4px)}
.empty{display:flex;align-items:center;justify-content:center}
.empty .star{width:64px;height:64px}
.card .yr{display:block;margin-top:10px;font-family:var(--grot);font-size:14px;color:var(--ink)}
.card h3{margin:2px 0 0;font-family:var(--grot);font-weight:500;font-size:clamp(17px,1.6vw,21px);letter-spacing:.01em;padding-bottom:14px;border-bottom:1px solid var(--faint)}
.card h3 small{font-family:var(--tc);font-weight:400;font-size:14px;color:var(--ink);margin-left:10px}
.after{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:40px;font-size:14px}
.wpin .after{margin-top:20px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--purple);color:#fff;font-family:var(--grot);font-size:14px;font-weight:500;letter-spacing:.06em;padding:9px 16px;border-radius:999px;transition:background .2s}
.pill:hover{background:var(--ink)}

/* contact */
#bring{color:#fff}
#bring.chap:before{background:var(--ink)}
#bring .proj-head h2{color:#fff}
.bpin{position:sticky}
.bbig{position:absolute;right:calc(50% - 50vw - 7vw);bottom:-13vw;width:28vw;height:28vw;pointer-events:none;z-index:-1}
.bbig .star{width:100%;height:100%;margin:0;vertical-align:top}
.bbig svg{animation-duration:30s}
.abil{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.abil li{padding:0 32px;border-left:1px solid rgba(255,255,255,.28);will-change:transform,opacity}
.abil li:first-child{padding-left:0;border-left:0}
.abil .n{display:block;font-family:var(--grot);font-weight:500;font-size:20px;line-height:1;color:var(--purple);margin-bottom:80px}
.abil h3{margin:0 0 16px;font-weight:500;font-size:24px;line-height:1.4;text-wrap:balance}
.abil p{margin:0;color:#fff;font-size:16px;line-height:1.75}
.nav{transition:background-color .3s,box-shadow .3s,color .3s}
.nav.dark{background:var(--ink);box-shadow:0 0 0 100vmax var(--ink);color:#fff}
.sec2 .mail{display:inline-block;margin-top:clamp(24px,3vw,36px)}
.mail{font-family:var(--grot);font-weight:500;font-size:clamp(24px,2.6vw,34px);letter-spacing:-.02em;border-bottom:1.5px solid var(--ink);padding-bottom:4px;transition:color .2s,border-color .2s}
.mail:hover{color:var(--purple);border-color:var(--purple)}
.stay{text-align:center;margin-top:clamp(120px,14vw,190px)}
.stay h2{font-family:var(--grot);font-weight:600;font-size:clamp(44px,9.4vw,124px);letter-spacing:-.055em;line-height:.9;margin:0}
.stay a{display:inline-block;margin-top:14px;font-family:var(--grot);font-size:clamp(17px,1.8vw,22px);font-weight:500}
.stay a:hover{color:var(--purple)}
.foot{display:flex;justify-content:space-between;gap:24px;margin-top:clamp(64px,8vw,100px);padding-bottom:40px;font-size:16px}
.foot .flogo{display:block;margin-bottom:12px}.foot .flogo{margin-bottom:20px}.foot .flogo .star{width:80px;height:80px;margin:0;display:block}.foot .fmail{font-size:20px}
.foot .g{color:var(--ink);display:block;user-select:all}
.foot ul{list-style:none;margin:0;padding:0;font-family:var(--grot);font-size:14px;font-weight:500;letter-spacing:.04em;display:grid;gap:4px}
.foot small{display:block;margin-top:40px;color:var(--ink);font-size:14px}

/* cursor */
.cur{position:fixed;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border:1.2px solid var(--purple);border-radius:50%;pointer-events:none;z-index:40;display:flex;align-items:center;justify-content:center;transition:width .3s,height .3s,margin .3s,background .3s,border-color .3s;mix-blend-mode:normal}
.cur:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--purple)}
.cur span{display:none;font-family:var(--grot);font-size:14px;font-weight:600;letter-spacing:.06em}
.cur.view{width:76px;height:76px;margin:-38px 0 0 -38px;background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.cur.view:after{display:none}.cur.view span{display:block}
@media (hover:none),(pointer:coarse){.cur{display:none}.card,.row,.scard{cursor:pointer}}
@media (max-width:720px){.hero>div{width:auto}.hero figure{margin:0}.hero{margin-inline:0;padding-inline:0;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:calc(100svh - 70px);padding-block:24px 56px}.nav ul{gap:10px;letter-spacing:0}.nav li{white-space:nowrap}.hero figure{order:-1;justify-self:end}.arrow{display:none}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:20px;margin-inline:0;padding:0;border:0}.row.flip .ph{order:0}.foot{flex-direction:column}.chap{margin-top:0}#work{height:auto}.wpin{position:static;height:auto;padding:0}.stack{flex:none;overflow:visible;clip-path:none}.scards{position:static;display:grid;gap:24px}.scard,.scard+.scard{position:relative;inset:auto;transform:none!important;grid-template-columns:1fr;padding:12px}.scard .ph{order:0;height:auto;aspect-ratio:576/354}.chap:before{display:none}.scard{position:relative;top:0;grid-template-columns:1fr;padding:12px}.scard .ph{order:0}.proj-head{margin-top:128px}#bring{height:auto;background:var(--ink);margin-inline:calc(50% - 50vw);padding:16px clamp(16px,5vw,72px) 160px;border-radius:24px;overflow:hidden;margin-top:128px}#bring .proj-head{margin-top:64px}.bpin{position:static;height:auto;padding:0;will-change:auto}.bbig{right:-12vw;bottom:-15vw;width:50vw;height:50vw}.abil{grid-template-columns:1fr;gap:40px}.abil li{padding:0;border:0;transform:none!important;opacity:1!important}.abil .n{margin-bottom:16px}.meta-row{grid-template-columns:auto 1fr auto}}
@media (prefers-reduced-motion:reduce){#bring{height:auto}.bpin{position:static;height:auto;padding:0}.abil li{transform:none!important;opacity:1!important}.chap{margin-top:0}#work{height:auto}.wpin{position:static;height:auto;padding:0}.stack{flex:none;overflow:visible;clip-path:none}.scards{position:static;display:grid;gap:24px}.scard,.scard+.scard{position:relative;inset:auto;transform:none!important;grid-template-columns:1fr;padding:12px}.scard .ph{order:0;height:auto;aspect-ratio:576/354}.chap:before{display:none}.about{height:auto}.about .pin{position:static;height:auto;padding-block:120px}.arrow{animation:none}.loader{display:none}.star svg{animation:none}.reveal span{color:var(--ink)}.reveal span.k{color:var(--purple)}}
/* footer: links in a row aligned with email, copyright right (v52) */
.foot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;column-gap:24px}
.foot{margin-top:clamp(120px,14vw,200px);padding-top:clamp(40px,4vw,56px);border-top:1px solid rgba(14,14,16,.15)}
.foot{position:relative;z-index:4}
.foot>div{display:contents}
.foot .flogo{grid-column:1;grid-row:1}
.foot .fmail{grid-column:1;grid-row:2}
.foot small{grid-column:1 / -1;grid-row:3;justify-self:end;color:rgba(14,14,16,.4);margin-top:-8px}
.foot ul{grid-column:2;grid-row:2;display:flex;gap:clamp(20px,3vw,48px);font-size:16px}
@media (max-width:720px){.foot{grid-template-columns:1fr}.foot ul{grid-column:1;grid-row:3;margin-top:24px}.foot small{grid-row:4}}
/* footer v2: row 1 flower + links, row 2 email + copyright */
.foot{row-gap:40px}
.foot .flogo{grid-column:1;grid-row:1;margin-bottom:0;align-self:end}
.foot ul{grid-column:2;grid-row:1;align-self:end;line-height:1}
.foot .fmail{grid-column:1;grid-row:2;font-size:16px;align-self:baseline}
.foot small{grid-column:2;grid-row:2;margin-top:0;align-self:baseline}
@media (max-width:720px){.foot{row-gap:24px}.foot ul{grid-column:1;grid-row:2;margin-top:8px}.foot .fmail{grid-row:3;margin-top:16px}.foot small{grid-column:1;grid-row:4;justify-self:start}}
/* hero follows 1320 wrap */@media (min-width:721px){.hero{margin-inline:0;padding-left:0;padding-right:0}.arrow{right:0}}
